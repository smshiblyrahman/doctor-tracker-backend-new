# Render deployment for Doctor Tracker backend.
# Deploys a single unified backend web service running all microservices and API gateway together.

services:
  - type: web
    name: doctor-tracker-backend
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        value: dev-access-secret-change-me-0123456789abcdef
      - key: JWT_REFRESH_SECRET
        value: dev-refresh-secret-change-me-0123456789abcdef
      - key: INTERNAL_JWT_SECRET
        value: dev-internal-secret-change-me-0123456789abcd
      - key: CLIENT_URL
        value: http://localhost:3000,https://doctor-tracker-frontend-new.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
